<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#05080d" />
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Nvidia Green -->
    <linearGradient id="nvidiaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76b900" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(35, 46, 66, 0.35)" stroke-width="0.8" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes scanline {
      0% { transform: translateY(-420px); }
      100% { transform: translateY(420px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes textShine {
      0% { fill-opacity: 0.7; }
      50% { fill-opacity: 1; }
      100% { fill-opacity: 0.7; }
    }
    .grid-bg { opacity: 0.8; }
    .pulse-dot { animation: blink 1.6s infinite ease-in-out; }
    .flow-path { stroke-dasharray: 12, 6; animation: flowLine 15s linear infinite; }
    .glow-logo { filter: url(#glow); }
    .title-text { animation: textShine 4s infinite ease-in-out; }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#232e42" stroke-width="1.5" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" class="grid-bg" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="140" fill="#10b981" opacity="0.06" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="160" fill="#06b6d4" opacity="0.05" filter="url(#glow)" />

  <!-- Animated Top Border Accent -->
  <line x1="60" y1="2" x2="1140" y2="2" stroke="url(#emeraldGrad)" stroke-width="3" class="flow-path" />

  <!-- Hackathon Meta Pill -->
  <g transform="translate(60, 48)">
    <rect width="440" height="32" rx="16" fill="#111722" stroke="#232e42" stroke-width="1" />
    <circle cx="20" cy="16" r="4.5" fill="#76b900" class="pulse-dot" />
    <text x="34" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a3e635" letter-spacing="1.5">NVIDIA</text>
    <text x="82" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">×</text>
    <text x="96" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">NEBIUS</text>
    <text x="146" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="0.5">GLOBAL AI HACKATHON</text>
    <rect x="360" y="7" width="66" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="0.8" />
    <text x="393" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10b981">v1.0 LIVE</text>
  </g>

  <!-- Main Hero Brand & Title -->
  <g transform="translate(60, 140)">
    <!-- Shield Logo Graphic -->
    <g transform="translate(0, -10)" class="glow-logo">
      <rect width="64" height="64" rx="14" fill="#0c1017" stroke="#10b981" stroke-width="1.8" />
      <path d="M 32 15 L 47 22 L 47 36 C 47 46 32 52 32 52 C 32 52 17 46 17 36 L 17 22 Z" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 28 32 L 31 36 L 38 27" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="84" y="32" font-family="'JetBrains Mono', monospace" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="2" class="title-text">
      INCIDENT<tspan fill="#10b981">ZERO</tspan>
    </text>

    <text x="86" y="62" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#94a3b8" letter-spacing="3">
      AUTONOMOUS AI INCIDENT COMMANDER
    </text>
  </g>

  <!-- Tagline / Subtitle Description -->
  <text x="60" y="246" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" font-weight="400">
    Multi-Agent reasoning platform powered by <tspan fill="#76b900" font-weight="600">NVIDIA Nemotron</tspan> on <tspan fill="#38bdf8" font-weight="600">Nebius Token Factory</tspan>.
  </text>
  <text x="60" y="268" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">
    Autonomously investigates production incidents, correlates logs &amp; telemetry, infers root cause, and executes safe remediation.
  </text>

  <!-- Live Pipeline Step Pills -->
  <g transform="translate(60, 310)">
    <!-- Detect -->
    <rect x="0" y="0" width="115" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="21" r="3" fill="#ef4444" class="pulse-dot" />
    <text x="28" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ef4444">DETECT</text>
    <text x="28" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Telemetry Probe</text>

    <!-- Arrow 1 -->
    <path d="M 125 21 L 140 21" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Investigate -->
    <rect x="150" y="0" width="130" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="166" cy="21" r="3" fill="#06b6d4" />
    <text x="178" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#06b6d4">INVESTIGATE</text>
    <text x="178" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Multi-Agent Fleet</text>

    <!-- Arrow 2 -->
    <path d="M 290 21 L 305 21" stroke="#334155" stroke-width="1.5" />

    <!-- Correlate -->
    <rect x="315" y="0" width="130" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="331" cy="21" r="3" fill="#8b5cf6" />
    <text x="343" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#8b5cf6">CORRELATE</text>
    <text x="343" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Evidence Dossier</text>

    <!-- Arrow 3 -->
    <path d="M 455 21 L 470 21" stroke="#334155" stroke-width="1.5" />

    <!-- Root Cause -->
    <rect x="480" y="0" width="130" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="496" cy="21" r="3" fill="#f43f5e" />
    <text x="508" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f43f5e">ROOT CAUSE</text>
    <text x="508" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Inferred Diagnosis</text>

    <!-- Arrow 4 -->
    <path d="M 620 21 L 635 21" stroke="#334155" stroke-width="1.5" />

    <!-- Safe Remediation -->
    <rect x="645" y="0" width="140" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="661" cy="21" r="3" fill="#f59e0b" />
    <text x="673" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f59e0b">SAFE REMEDIATE</text>
    <text x="673" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Whitelisted Action</text>

    <!-- Arrow 5 -->
    <path d="M 795 21 L 810 21" stroke="#334155" stroke-width="1.5" />

    <!-- Verify Recovery -->
    <rect x="820" y="0" width="135" height="42" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="836" cy="21" r="3" fill="#10b981" class="pulse-dot" />
    <text x="848" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">RECOVERY</text>
    <text x="848" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#34d399">Certified Stable</text>

    <!-- Arrow 6 -->
    <path d="M 965 21 L 980 21" stroke="#334155" stroke-width="1.5" />

    <!-- Post-Mortem -->
    <rect x="990" y="0" width="130" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="1006" cy="21" r="3" fill="#a855f7" />
    <text x="1018" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a855f7">POST-MORTEM</text>
    <text x="1018" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Executive Report</text>
  </g>

  <!-- Glowing Bottom Right Status Monitor -->
  <g transform="translate(930, 48)">
    <rect width="210" height="68" rx="12" fill="#0c1017" stroke="#232e42" stroke-width="1" />
    <circle cx="20" cy="24" r="4" fill="#10b981" class="pulse-dot" />
    <text x="32" y="27" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#e2e8f0">NEBIUS REASONING</text>
    <text x="32" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#76b900">NVIDIA Nemotron 70B</text>
    <text x="32" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Latency P99: 185ms (Nominal)</text>
  </g>
</svg>
